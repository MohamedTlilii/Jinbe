<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ocean" cx="50%" cy="60%" r="60%">
      <stop offset="0%"   stop-color="#0066cc"/>
      <stop offset="60%"  stop-color="#003d99"/>
      <stop offset="100%" stop-color="#001133"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00eeff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0044bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond océan profond -->
  <circle cx="16" cy="16" r="16" fill="url(#ocean)"/>

  <!-- Tourbillon d'eau — cercles concentriques -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#00aaff" stroke-width="1.8" opacity="0.3" stroke-dasharray="4 3"/>
  <circle cx="16" cy="16" r="8"  fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 2"/>
  <circle cx="16" cy="16" r="5"  fill="none" stroke="#00eeff" stroke-width="1.2" opacity="0.7"/>

  <!-- Centre lumineux — œil du vortex -->
  <circle cx="16" cy="16" r="4" fill="url(#core)"/>
  <circle cx="16" cy="16" r="2" fill="#00eeff" opacity="0.95"/>
  <circle cx="15" cy="15" r="0.7" fill="white" opacity="0.8"/>

  <!-- Vagues qui sortent du vortex -->
  <path d="M5,16 Q8,12 11,16 Q14,20 16,16" fill="none" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M16,16 Q18,12 21,16 Q24,20 27,16" fill="none" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Éclaboussures -->
  <circle cx="8"  cy="9"  r="1"   fill="#00eeff" opacity="0.7"/>
  <circle cx="24" cy="9"  r="0.8" fill="#00eeff" opacity="0.6"/>
  <circle cx="6"  cy="22" r="0.7" fill="#fff"    opacity="0.5"/>
  <circle cx="26" cy="22" r="0.9" fill="#00eeff" opacity="0.6"/>
  <circle cx="16" cy="5"  r="1"   fill="#fff"    opacity="0.6"/>
  <circle cx="16" cy="27" r="0.8" fill="#00eeff" opacity="0.5"/>

  <!-- Anneau extérieur -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#0055cc" stroke-width="1" opacity="0.6"/>
</svg>
